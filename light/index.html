<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5fbf">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Avvisa Clienti">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Avvisa Clienti</title>
<style>
:root{--g:#1f5fbf;--g2:#e7effb;--t:#17212b;--m:#6b7885;--l:#e3e8ec;--bg:#f3f6f8;--r:#c0392b;--o:#e8590c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--t);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:19px;margin:0;flex:1}
header small{display:block;font-weight:400;font-size:12px;opacity:.85}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:10px;font-size:18px;padding:8px 11px}
main{padding:12px 12px 20px;max-width:640px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--l);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;padding:9px 2px 8px;font-size:11px;color:var(--m);display:grid;gap:1px;justify-items:center}
nav button span{font-size:22px;line-height:1}
nav button.on{color:var(--g);font-weight:700}
nav i{position:absolute;margin:-2px 0 0 18px;background:var(--o);color:#fff;font-style:normal;font-size:10px;font-weight:700;border-radius:9px;padding:1px 5px}
.card{background:#fff;border-radius:14px;padding:13px 14px;margin:0 0 12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card h2{font-size:15px;margin:0 0 8px;display:flex;gap:6px;align-items:center}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--l)}
.row:first-of-type{border-top:0}
.row .x{flex:1;min-width:0}
.row .x b,.row .x span{display:block;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--m);font-size:13px}
.btn{border:0;border-radius:12px;background:var(--g);color:#fff;font-size:16px;font-weight:650;padding:12px 16px}
.btn.s{padding:8px 12px;font-size:14px}
.btn.o{background:var(--g2);color:var(--g)}
.btn.w{width:100%}
.btn:disabled{opacity:.45}
.pill{display:inline-block;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:650;background:var(--g2);color:var(--g)}
.pill.a{background:#fff1e6;color:var(--o)}.pill.r{background:#fdecea;color:var(--r)}.pill.m{background:#eef1f4;color:var(--m)}
input,textarea,select{width:100%;font:inherit;padding:11px 12px;border:1px solid #cfd8de;border-radius:11px;background:#fff;color:var(--t)}
textarea{min-height:120px;resize:vertical}
label.c{display:flex;gap:10px;align-items:center}
input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--g)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:0 -2px 8px}
.chips button{flex:none;border:1px solid #cfd8de;background:#fff;border-radius:22px;padding:9px 14px;font-size:14px;color:var(--t)}
.chips button.on{background:var(--g);border-color:var(--g);color:#fff;font-weight:650}
.seg{display:flex;background:#e9eef1;border-radius:11px;padding:3px;margin:6px 0}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 4px;font-size:14px;color:var(--m)}
.seg button.on{background:#fff;color:var(--t);font-weight:650;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.ov{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:90vh;overflow:auto;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 4px;font-size:19px}
.prev{white-space:pre-wrap;background:#f3f6f8;border-radius:11px;padding:11px 12px;font-size:14px;margin:8px 0}
.lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lock .card{width:100%;max-width:380px;padding:22px}
.lock h1{margin:0 0 4px;font-size:24px;color:var(--g)}
.err{color:var(--r);font-size:14px;min-height:20px;margin:6px 0}
.empty{color:var(--m);padding:14px 4px;text-align:center}
.warn{background:#fff7e6;border:1px solid #f5d28b;color:#8a5a00;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.big{font-size:19px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#17212b;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:90%}
.fl{margin:10px 0 4px}
.tagc{border:1px solid #cfd8de;background:#fff;border-radius:22px;padding:7px 12px;font-size:14px;color:var(--t);margin:0 6px 6px 0}.tagc.on{background:var(--g);border-color:var(--g);color:#fff;font-weight:650}
</style>

</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ---------- utilità ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('Memoria piena: non riesco a salvare');return false}}};
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayIso=()=>isoOf(new Date());
const fmtD=i=>{const p=String(i||'').slice(0,10).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:''};
const eur=n=>Number(n||0).toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const tc=v=>String(v||'').trim().toLowerCase().replace(/(^|[\s'-])(\S)/g,(m,a,b)=>a+b.toUpperCase());
const first=n=>tc(String(n||'').trim().split(/\s+/)[0]||'');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function normTel(v){let raw=String(v||'').trim();if(!raw)return'';let plus=raw.startsWith('+');let d=raw.replace(/\D/g,'');if(d.startsWith('00')){d=d.slice(2);plus=true}if(!plus&&!(d.startsWith('39')&&d.length>=11))d='39'+d.replace(/^0+(?=3)/,'');if(d.startsWith('39')&&!/^393\d{8,9}$/.test(d))return'';return d.length>=11&&d.length<=15?'+'+d:''}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
function addMonths(iso,m){const p=String(iso).split('-').map(Number);if(p.length!==3||!p[0])return'';return isoOf(new Date(p[0],p[1]-1+Number(m||0),p[2]))}
const daysTo=iso=>{const p=String(iso).split('-').map(Number);if(p.length!==3)return 9999;const t=new Date();return Math.round((new Date(p[0],p[1]-1,p[2])-new Date(t.getFullYear(),t.getMonth(),t.getDate()))/86400000)};

/* ---------- tipi di negozio (modelli di partenza) ---------- */
const TPL_LAV='Buongiorno {nome}, {titolo} è pronto per il ritiro presso {negozio}{indirizzo}.{importo} Grazie!';
const TPL_SCA='Buongiorno {nome}, ricordiamo la scadenza di {titolo} il {data}. Passi da {negozio}{indirizzo}, siamo a disposizione!';
const PRESETS={
 telefonia:{nome:'Telefonia / Elettronica',tags:['Privato','Azienda'],tipi:[
  {id:'rip',nome:'Riparazione',icona:'🛠️',modo:'lavoro',lt:'Dispositivo (es. iPhone 12)',ld:'Guasto / lavoro',tpl:'Buongiorno {nome}, il suo {titolo} è pronto per il ritiro presso {negozio}{indirizzo}.{importo} Grazie!'},
  {id:'contr',nome:'Contratto',icona:'📄',modo:'scadenza',lt:'Servizio (luce, gas, fibra…)',lf:'Gestore / fornitore',mesi:12,giorni:30,tpl:'Buongiorno {nome}, il suo contratto {titolo} {fornitore} scade il {data}. Passi da {negozio}{indirizzo} per vedere le nuove offerte!'}]},
 auto:{nome:'Officina / Auto',tags:['Privato','Azienda'],tipi:[
  {id:'lavoro',nome:'Lavoro in officina',icona:'🔧',modo:'lavoro',lt:'Veicolo (modello / targa)',ld:'Intervento',tpl:'Buongiorno {nome}, il suo veicolo {titolo} è pronto per il ritiro presso {negozio}{indirizzo}.{importo} Grazie!'},
  {id:'tagl',nome:'Tagliando / Revisione',icona:'🚗',modo:'scadenza',lt:'Veicolo (modello / targa)',lf:'Cosa (tagliando, revisione…)',mesi:12,giorni:30,tpl:'Buongiorno {nome}, per {titolo} {fornitore} la scadenza è il {data}. Ci chiami o passi da {negozio}{indirizzo} per prenotare.'}]},
 estetica:{nome:'Parrucchiere / Estetica',tags:['Cliente fisso','Nuovo cliente'],tipi:[
  {id:'trat',nome:'Promemoria trattamento',icona:'💇',modo:'scadenza',lt:'Trattamento (colore, taglio…)',lf:'',mesi:2,giorni:7,tpl:'Buongiorno {nome}, è ora di pensare al prossimo appuntamento per {titolo}. La aspettiamo da {negozio}{indirizzo}!'}]},
 altro:{nome:'Altro tipo di negozio',tags:[],tipi:[
  {id:'lavoro',nome:'Lavoro da riconsegnare',icona:'🧰',modo:'lavoro',lt:'Oggetto',ld:'Descrizione del lavoro',tpl:TPL_LAV},
  {id:'prom',nome:'Promemoria con scadenza',icona:'⏰',modo:'scadenza',lt:'Cosa scade',lf:'',mesi:12,giorni:30,tpl:TPL_SCA}]}
};
const cloneTipo=(t,id)=>Object.assign({},t,{id:id||uid()});

/* ---------- dati (restano in questo telefono) ---------- */
function migrate(d){
 if(!d||d.v>=2)return d;
 const t=PRESETS.telefonia.tipi.map(x=>Object.assign({},x));
 const tp=LS.get('ac_tpl',{});if(tp.rip)t[0].tpl=String(tp.rip).split('{dispositivo}').join('{titolo}');if(tp.scad)t[1].tpl=String(tp.scad).split('{contratto}').join('{titolo} {fornitore}');
 const schede=[];
 for(const x of d.rip||[])schede.push({id:x.id,tid:'rip',cid:x.cid,titolo:x.disp||'',dettaglio:x.guasto||'',prezzo:x.prezzo,stato:x.stato||'lavorazione',data:x.data,pronto:x.pronto,ritiro:x.ritiro,note:x.note||''});
 for(const x of d.contr||[])schede.push({id:x.id,tid:'contr',cid:x.cid,titolo:x.tipo||'',fornitore:x.gestore||'',inizio:x.inizio,mesi:x.mesi,scad:x.scad,note:x.note||'',chiuso:x.chiuso});
 const g=Number(d.shop&&d.shop.giorni)||30;t[1].giorni=g;
 return{v:2,shop:Object.assign({nome:'',indirizzo:''},d.shop),tags:[],tipi:t,clienti:(d.clienti||[]).map(c=>Object.assign({tags:[]},c)),schede};
}
let S=migrate(LS.get('ac_data',null))||{v:2,shop:{nome:'',indirizzo:''},tags:[],tipi:[],clienti:[],schede:[]};
if(S.v>=2&&!LS.get('ac_data',{}).v)LS.set('ac_data',S);
const save=()=>LS.set('ac_data',S);
const cli=id=>S.clienti.find(c=>c.id===id)||{id:'',nome:'(cliente eliminato)',tel:'',tags:[]};
const tipo=id=>S.tipi.find(t=>t.id===id);
const sent=()=>LS.get('ac_sent',{});
function markSent(key){const s=sent();s[key]=Date.now();LS.set('ac_sent',s)}
const isSent=key=>sent()[key];
const sentTxt=key=>{const t=isSent(key);return t?'✓ '+fmtD(isoOf(new Date(t))):''};
const ST={lavorazione:'In lavorazione',pronto:'Pronto',ritirato:'Ritirato'};
const scadOf=x=>x.scad||addMonths(x.inizio,x.mesi);

/* ---------- modelli messaggio ---------- */
const DEF={auguri:'Buon compleanno {nome}! 🎂 Tanti auguri da {negozio}.',libero:'Buongiorno {nome}, '};
const tpl=k=>{if(k.startsWith('T:')){const t=tipo(k.slice(2));return t?t.tpl:''}return(LS.get('ac_tpl',{})[k])||DEF[k]};
const defTpl=k=>{if(k.startsWith('T:')){const t=tipo(k.slice(2));return t?(t.modo==='lavoro'?TPL_LAV:TPL_SCA):''}return DEF[k]};
const shopName=()=>S.shop.nome||'noi';
function fill(t,r,grp){let o=String(t);const v=Object.assign({nome:grp?'':first(r.nome),negozio:shopName(),indirizzo:S.shop.indirizzo?' ('+S.shop.indirizzo+')':''},r.vars||{});for(const k in v)o=o.split('{'+k+'}').join(v[k]);if(!v.nome)o=o.replace(/ \{nome\}/g,'').replace(/\{nome\}/g,'').replace(/Buongiorno ,/g,'Buongiorno,');return o.replace(/ {2,}/g,' ').replace(/ ,/g,',').replace(/ \./g,'.')}
function schedaVars(x,d){const t=tipo(x.tid)||{};return{titolo:x.titolo||'',dettaglio:x.dettaglio||'',fornitore:x.fornitore||'',data:fmtD(d||scadOf(x)),importo:Number(x.prezzo)>0?' Importo: '+eur(x.prezzo)+'.':'',dispositivo:x.titolo||'',contratto:((x.titolo||'')+' '+(x.fornitore||'')).trim()}}

/* ---------- stato ---------- */
let tab='oggi',msg={tipo:null,sel:{},text:'',ch:'sms',q:'',tag:'',manual:''},cq='',ctag='',stipo='',queue=null;

/* ---------- elenchi derivati ---------- */
function bdays(maxOff){const t=new Date(),out=[];for(let off=0;off<=maxOff;off++){const d=new Date(t.getFullYear(),t.getMonth(),t.getDate()+off);for(const c of S.clienti){const p=String(c.nasc||'').split('-').map(Number);if(p.length===3&&p[1]===d.getMonth()+1&&p[2]===d.getDate())out.push({c,off,key:'a|'+c.id+'|'+d.getFullYear()})}}return out}
function dueItems(t){
 if(t.modo==='lavoro')return S.schede.filter(x=>x.tid===t.id&&x.stato==='pronto').map(x=>({x,t,key:'r|'+x.id+'|'+(x.pronto||''),info:(x.titolo||'')+(x.pronto?' · pronto il '+fmtD(x.pronto):'')}));
 const g=Number(t.giorni)||30;
 return S.schede.filter(x=>x.tid===t.id&&!x.chiuso).map(x=>{const d=scadOf(x);return{x,t,d,gg:daysTo(d),key:'s|'+x.id+'|'+d}}).filter(o=>o.d&&o.gg<=g).sort((a,b)=>a.d.localeCompare(b.d)).map(o=>Object.assign(o,{info:(o.gg<0?'scaduto il ':'scade il ')+fmtD(o.d)+' · '+(o.x.titolo||'')+(o.x.fornitore?' '+o.x.fornitore:'')}))}
const recOf=o=>{const c=cli(o.x.cid);return{id:o.key,nome:c.nome,tel:c.tel,info:o.info,due:true,vars:schedaVars(o.x,o.d)}};
function recipients(k){
 if(k==='auguri')return bdays(7).map(b=>({id:b.key,nome:b.c.nome,tel:b.c.tel,info:b.off===0?'Oggi':b.off===1?'Domani':'tra '+b.off+' giorni',due:b.off===0,vars:{}}));
 if(k.startsWith('T:')){const t=tipo(k.slice(2));return t?dueItems(t).map(recOf):[]}
 if(k==='libero'){const q=msg.q.trim().toLowerCase(),dq=q.replace(/\D/g,'');let l=S.clienti.filter(c=>c.tel);if(msg.tag)l=l.filter(c=>(c.tags||[]).includes(msg.tag));if(q)l=l.filter(c=>c.nome.toLowerCase().includes(q)||(dq.length>=3&&c.tel.replace(/\D/g,'').includes(dq)));
  const out=l.slice().sort((a,b)=>a.nome.localeCompare(b.nome,'it')).slice(0,100).map(c=>({id:'l|'+c.id,nome:c.nome,tel:c.tel,info:c.tel+((c.tags||[]).length?' · '+c.tags.join(', '):''),due:false,vars:{}}));
  for(const id in msg.sel)if(msg.sel[id]&&msg.sel[id].extra&&!out.find(o=>o.id===id))out.unshift(msg.sel[id].extra);return out}
 return[]}

/* ---------- invio ---------- */
function smsHref(tels,body){return 'sms:'+tels.join(',')+'?&body='+encodeURIComponent(body)}
function waHref(tel,body){return 'https://wa.me/'+tel.replace(/\D/g,'')+'?text='+encodeURIComponent(body)}
function openLink(h){const a=document.createElement('a');a.href=h;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}
function sendOne(r,text,ch,key){const tel=normTel(r.tel);if(!tel){toast('Manca un numero di cellulare valido');return false}if(key)markSent(key);if(ch==='wa')openLink(waHref(tel,text));else location.href=smsHref([tel],text);return true}

/* ---------- finestre e moduli ---------- */
function sheet(html){document.getElementById('sov')?.remove();const o=document.createElement('div');o.className='ov';o.id='sov';o.innerHTML='<div class="sheet">'+html+'</div>';o.onclick=e=>{if(e.target===o)o.remove()};document.body.appendChild(o);return o}
function formSheet(title,fields,onSave,onDelete,after){
 const fld=f=>{const v=f.value??'';
  if(f.type==='cliente'){const l=S.clienti.slice().sort((a,b)=>a.nome.localeCompare(b.nome,'it'));return `<div class="sub fl">${esc(f.label)}</div><select data-f="${f.k}"><option value="">＋ Nuovo cliente…</option>${l.map(c=>`<option value="${c.id}" ${c.id===v?'selected':''}>${esc(c.nome)}${c.tel?' · '+esc(c.tel):''}</option>`).join('')}</select><div id="newCli" style="${v?'display:none':''}"><input data-f="_nome" placeholder="Nome e cognome" style="margin-top:8px"><input data-f="_tel" type="tel" inputmode="tel" placeholder="Cellulare" style="margin-top:8px"></div>`}
  if(f.type==='tags')return `<div class="sub fl">${esc(f.label)}</div><div class="chips" id="tagBox" style="flex-wrap:wrap;overflow:visible">${S.tags.map(t=>`<button type="button" class="tagc ${(v||[]).includes(t)?'on':''}" data-t="${esc(t)}">${esc(t)}</button>`).join('')}</div><div style="display:flex;gap:8px"><input id="tagNew" placeholder="＋ nuova categoria" style="padding:8px 10px"><button type="button" class="btn s o" id="tagAdd">Aggiungi</button></div>`;
  if(f.type==='select')return `<div class="sub fl">${esc(f.label)}</div><select data-f="${f.k}" ${f.disabled?'disabled':''}>${f.options.map(o=>{const[val,txt]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(val)===String(v)?'selected':''}>${esc(txt)}</option>`}).join('')}</select>`;
  if(f.type==='textarea')return `<div class="sub fl">${esc(f.label)}</div><textarea data-f="${f.k}" style="min-height:${f.h||70}px" placeholder="${esc(f.placeholder||'')}">${esc(v)}</textarea>`;
  return `<div class="sub fl">${esc(f.label)}</div><input data-f="${f.k}" type="${f.type||'text'}" ${f.type==='number'?'inputmode="decimal" step="any"':''} ${f.type==='tel'?'inputmode="tel"':''} value="${esc(v)}" placeholder="${esc(f.placeholder||'')}">`};
 const o=sheet(`<h3>${esc(title)}</h3>${fields.map(fld).join('')}<div class="err" id="fErr"></div><button class="btn w" id="fOk">Salva</button>${onDelete?'<button class="btn w" id="fDel" style="margin-top:10px;background:#fdecea;color:#c0392b">Elimina</button>':''}<button class="btn o w" style="margin-top:10px" id="fX">Annulla</button>`);
 const fin=()=>{o.remove();after?after():draw()};
 const sel=o.querySelector('select[data-f="cid"]');if(sel)sel.onchange=()=>{$('#newCli').style.display=sel.value?'none':''};
 const tb=$('#tagBox');if(tb){const bind=()=>tb.querySelectorAll('.tagc').forEach(b=>b.onclick=()=>b.classList.toggle('on'));bind();$('#tagAdd').onclick=()=>{const n=tc($('#tagNew').value);if(!n)return;if(!S.tags.includes(n))S.tags.push(n);save();const b=document.createElement('button');b.type='button';b.className='tagc on';b.dataset.t=n;b.textContent=n;if(!tb.querySelector('[data-t="'+n.replace(/"/g,'\\"')+'"]'))tb.appendChild(b);bind();$('#tagNew').value=''}}
 $('#fX').onclick=()=>o.remove();
 if(onDelete)$('#fDel').onclick=()=>{if(confirm('Eliminare definitivamente?')){onDelete();save();fin()}};
 $('#fOk').onclick=()=>{const r={};o.querySelectorAll('[data-f]').forEach(e=>r[e.dataset.f]=e.value.trim());if(tb)r.tags=[...tb.querySelectorAll('.tagc.on')].map(b=>b.dataset.t);
  for(const f of fields){if(f.type==='cliente'){if(!r.cid){if(!r._nome){$('#fErr').textContent='Scegli un cliente o scrivi il nome del nuovo';return}const c={id:uid(),nome:tc(r._nome),tel:r._tel||'',nasc:'',note:'',tags:[]};S.clienti.push(c);r.cid=c.id}}else if(f.required&&!r[f.k]){$('#fErr').textContent='Manca: '+f.label;return}}
  delete r._nome;delete r._tel;const err=onSave(r);if(err){$('#fErr').textContent=err;return}save();fin()}}

 else{
  const g=Number(t.giorni)||30,l=all.map(x=>({x,d:scadOf(x),gg:daysTo(scadOf(x))})).sort((a,b)=>a.d.localeCompare(b.d));
  h+=`<div class="sub" style="margin:0 2px 8px">L’app ti avvisa ${g} giorni prima della data da ricontattare.</div><div class="card" style="padding:4px 14px">${l.map(o=>{const c=cli(o.x.cid),k='s|'+o.x.id+'|'+o.d,due=o.gg<=g;return `<div class="row"><div class="x" data-es="${o.x.id}"><b>${esc(c.nome)} · ${esc(o.x.titolo||'')} ${esc(o.x.fornitore||'')}</b><span class="sub">dal ${fmtD(o.x.inizio)} · ${o.gg<0?'da ricontattare dal':'da ricontattare il'} ${fmtD(o.d)} ${sentTxt(k)}</span></div>${due?`<button class="btn s ${isSent(k)?'o':''}" data-act="avvisa" data-id="${o.x.id}">${isSent(k)?'Reinvia':'Avvisa'}</button>`:`<span class="pill m">tra ${o.gg} gg</span>`}</div>`}).join('')||'<div class="empty">Nessuna scheda inserita.</div>'}</div>`}
 m.insertAdjacentHTML('beforeend',h);
 m.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{stipo=b.dataset.st;draw()});
 m.querySelectorAll('[data-es]').forEach(r=>r.onclick=()=>editScheda(S.schede.find(x=>x.id===r.dataset.es)));bind(m)}

/* ---------- azioni ---------- */
function bind(m){m.querySelectorAll('[data-act]').forEach(b=>b.onclick=async()=>{const a=b.dataset.act,id=b.dataset.id;
 if(a==='newCli')editCliente();else if(a==='newScheda')editScheda(null,stipo);else if(a==='settings')settings();
 else if(a==='auguri'){const c=cli(id),r={nome:c.nome,tel:c.tel,vars:{}},k='a|'+c.id+'|'+new Date().getFullYear();if(sendOne(r,fill(tpl('auguri'),r,false),'sms',k))setTimeout(draw,500)}
 else if(a==='avvisa'){const x=S.schede.find(v=>v.id===id),t=tipo(x.tid),o=dueItems(t).find(v=>v.x.id===id);if(!o)return;const r=recOf(o);if(sendOne(r,fill(t.tpl||defTpl('T:'+t.id),r,false),'sms',r.id))setTimeout(draw,500)}
 else if(a==='pronto'){const x=S.schede.find(v=>v.id===id);x.stato='pronto';x.pronto=todayIso();save();draw();toast('Segnata pronta: premi Avvisa per scrivere al cliente')}
 else if(a==='ritirata'){const x=S.schede.find(v=>v.id===id);x.stato='ritirato';x.ritiro=todayIso();save();draw()}
 else if(a==='gotoMsg'){tab='msg';pickTipo('T:'+id);draw();scrollTo(0,0)}
 else if(a==='rubrica'){try{const cs=await navigator.contacts.select(['name','tel'],{multiple:true});let n=0;for(const k of cs){const nome=tc((k.name||[])[0]||''),tel=String((k.tel||[])[0]||'').replace(/\s+/g,'');if(!nome)continue;if(S.clienti.find(c=>c.nome===nome&&c.tel===tel))continue;S.clienti.push({id:uid(),nome,tel,nasc:'',note:'',tags:[]});n++}save();draw();toast(n+' clienti importati')}catch(e){toast('Importazione annullata')}}})}

/* ---------- primo avvio ---------- */
function welcome(){
 const o=sheet(`<h3>Benvenuto 👋</h3><div class="sub">Due domande e sei pronto. Potrai cambiare tutto dalle impostazioni ⚙️.</div><div class="sub fl">Nome del tuo negozio</div><input id="wN" placeholder="es. Riparazioni Rossi"><div class="sub fl">Indirizzo (facoltativo, compare nei messaggi)</div><input id="wI" placeholder="es. Via Roma 1, Udine"><div class="sub fl">Che tipo di attività hai?</div><select id="wP">${Object.entries(PRESETS).map(([k,p])=>`<option value="${k}">${esc(p.nome)}</option>`).join('')}</select><div class="sub" style="margin-top:6px">Sceglie i tipi di scheda e i testi di partenza; puoi aggiungerne o crearne altri quando vuoi.</div><button class="btn w" style="margin-top:14px" id="wGo">Inizia</button>`);
 o.onclick=null;
 $('#wGo').onclick=()=>{const p=PRESETS[$('#wP').value];S.shop.nome=$('#wN').value.trim();S.shop.indirizzo=$('#wI').value.trim();S.tags=p.tags.slice();S.tipi=p.tipi.map(t=>cloneTipo(t));save();o.remove();draw()}}

/* ---------- impostazioni e backup ---------- */
function settings(){
 const o=sheet(`<h3>Impostazioni</h3>
 <h2 style="font-size:15px;margin:14px 0 4px">Il tuo negozio</h2><div class="sub">Compare nei messaggi al posto di {negozio} e {indirizzo}.</div>
 <div class="sub fl">Nome del negozio</div><input id="sN" value="${esc(S.shop.nome)}" placeholder="es. Riparazioni Rossi"><div class="sub fl">Indirizzo (facoltativo)</div><input id="sI" value="${esc(S.shop.indirizzo)}" placeholder="es. Via Roma 1, Udine">
 <h2 style="font-size:15px;margin:18px 0 4px">Categorie dei clienti</h2><div class="sub">Servono per ordinare i clienti e scrivere solo a un gruppo.</div>
 <div class="chips" style="flex-wrap:wrap;overflow:visible;margin-top:8px">${S.tags.map(g=>`<button class="tagc on" data-deltag="${esc(g)}">${esc(g)} ✕</button>`).join('')||'<span class="sub">Nessuna categoria.</span>'}</div>
 <div style="display:flex;gap:8px"><input id="sTag" placeholder="＋ nuova categoria" style="padding:8px 10px"><button class="btn s o" id="sTagAdd">Aggiungi</button></div>
 <h2 style="font-size:15px;margin:18px 0 4px">Tipi di scheda</h2><div class="sub">Ogni tipo ha il suo elenco, i suoi campi e il suo messaggio (riparazioni, contratti, tagliandi…).</div>
 ${S.tipi.map(t=>`<div class="row" data-et="${t.id}"><div class="x"><b>${esc(t.icona||'')} ${esc(t.nome)}</b><span class="sub">${t.modo==='lavoro'?'Lavoro da riconsegnare':'Scadenza dopo '+t.mesi+' mesi, avviso '+t.giorni+' giorni prima'}</span></div><span class="sub">✎</span></div>`).join('')}
 <button class="btn o w" style="margin-top:10px" id="sNewT">＋ Nuovo tipo di scheda</button>
 <div class="sub fl">Usi l’app per più negozi? Aggiungi i tipi di un’altra attività:</div><div style="display:flex;gap:8px"><select id="sPre">${Object.entries(PRESETS).map(([k,p])=>`<option value="${k}">${esc(p.nome)}</option>`).join('')}</select><button class="btn s o" id="sPreAdd">Aggiungi</button></div>
 <h2 style="font-size:15px;margin:18px 0 4px">Altri modelli di messaggio</h2><div class="sub">I testi di ogni tipo di scheda si cambiano dal tipo stesso. Usa {nome} e {negozio}.</div>
 ${[['auguri','🎂 Auguri'],['libero','✏️ Messaggio libero']].map(([k,n])=>`<div class="sub fl"><b>${n}</b></div><textarea data-tp2="${k}" style="min-height:84px">${esc(tpl(k))}</textarea>`).join('')}
 <button class="btn w" style="margin-top:12px" id="sSave">Salva</button>
 <h2 style="font-size:15px;margin:18px 0 4px">Copia di sicurezza</h2><div class="sub">I dati stanno solo su questo telefono: salva ogni tanto una copia (su Drive, email…). Serve anche per passare a un telefono nuovo.</div>
 <button class="btn o w" style="margin-top:10px" id="sExp">⬇️ Salva una copia dei dati</button><button class="btn o w" style="margin-top:10px" id="sImp">⬆️ Ripristina da una copia</button><input id="sFl" type="file" accept=".json,application/json" style="display:none">
 <button class="btn o w" style="margin-top:10px" id="sX">Chiudi</button>`);
 const back=()=>{draw();settings()};
 $('#sX').onclick=()=>o.remove();
 o.querySelectorAll('[data-deltag]').forEach(b=>b.onclick=()=>{const g=b.dataset.deltag;if(!confirm('Eliminare la categoria «'+g+'»? Resta nei clienti solo il resto.'))return;S.tags=S.tags.filter(x=>x!==g);S.clienti.forEach(c=>c.tags=(c.tags||[]).filter(x=>x!==g));save();back()});
 $('#sTagAdd').onclick=()=>{const n=tc($('#sTag').value);if(!n)return;if(!S.tags.includes(n))S.tags.push(n);save();back()};
 o.querySelectorAll('[data-et]').forEach(r=>r.onclick=()=>editTipo(tipo(r.dataset.et),back));
 $('#sNewT').onclick=()=>editTipo(null,back);
 $('#sPreAdd').onclick=()=>{const p=PRESETS[$('#sPre').value];let n=0;for(const t of p.tipi)if(!S.tipi.some(x=>x.nome===t.nome)){S.tipi.push(cloneTipo(t));n++}for(const g of p.tags)if(!S.tags.includes(g))S.tags.push(g);save();toast(n?n+' tipi aggiunti':'Questi tipi ci sono già');back()};
 $('#sSave').onclick=()=>{S.shop.nome=$('#sN').value.trim();S.shop.indirizzo=$('#sI').value.trim();const s={};o.querySelectorAll('[data-tp2]').forEach(t=>{if(t.value.trim()&&t.value!==DEF[t.dataset.tp2])s[t.dataset.tp2]=t.value});LS.set('ac_tpl',s);save();msg.text=msg.tipo?tpl(msg.tipo):'';toast('Salvato');o.remove();draw()};
 $('#sExp').onclick=async()=>{const txt=JSON.stringify({app:'avvisa-clienti',at:new Date().toISOString(),data:S,tpl:LS.get('ac_tpl',{}),sent:sent()}),name='avvisa-clienti-backup-'+todayIso()+'.json';
  try{const f=new File([txt],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});LS.set('ac_bk',Date.now());return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);LS.set('ac_bk',Date.now());toast('Copia salvata')};
 $('#sImp').onclick=()=>$('#sFl').click();
 $('#sFl').onchange=async()=>{const f=$('#sFl').files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(j.app!=='avvisa-clienti'||!j.data||!Array.isArray(j.data.clienti))throw 0;if(!confirm('Sostituire i dati di questo telefono con quelli della copia del '+fmtD(String(j.at).slice(0,10))+' ('+j.data.clienti.length+' clienti)?'))return;LS.set('ac_tpl',j.tpl||{});S=migrate(j.data);S.tags=S.tags||[];save();LS.set('ac_sent',j.sent||{});o.remove();draw();toast('Dati ripristinati')}catch(e){toast('Questo file non è una copia valida')}}}

if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
draw();
if(!S.tipi.length&&!S.clienti.length)setTimeout(welcome,200);

</script>
</body>
</html>
